[external-auth]
spoe-agent external-auth-agent
    groups check-auth-group
    option var-prefix spoe
    option continue-on-error
    timeout hello      2s
    timeout idle       5m
    timeout processing 6s
    use-backend spoa-hub-backend

spoe-message check-auth
    # Required:
    #   auth_url    — auth service URL (the plugin appends `path` to it)
    #
    # Optional per-request overrides (override the plugin's TOML config
    # when present; falls back to config when absent or empty):
    #   method            — HTTP method for the auth subrequest ("GET" / "HEAD")
    #   forward_headers   — comma-separated list of request headers to send
    #                       to the auth service (overrides config.forward_headers)
    #   extract_headers   — comma-separated list of response headers to extract
    #                       from a 2xx auth reply (overrides config.extract_headers)
    #
    # Any `hdr_<name>` arg becomes a header value the plugin can forward
    # (subject to the resolved forward_headers list).
    args auth_url=var(txn.auth_url) \
         path=path \
         hdr_authorization=req.hdr(Authorization) \
         hdr_cookie=req.hdr(Cookie) \
         hdr_x_forwarded_for=req.hdr(X-Forwarded-For) \
         hdr_x_forwarded_proto=req.hdr(X-Forwarded-Proto) \
         hdr_x_forwarded_host=req.hdr(X-Forwarded-Host) \
         hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri)

spoe-group check-auth-group
    messages check-auth
