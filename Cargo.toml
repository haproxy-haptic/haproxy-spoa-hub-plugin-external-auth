[package]
name = "external-auth-plugin"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
description = "External auth subrequest plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = "0.2"
abi_stable = "0.11"
ureq = "3"
http = "1"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tiny_http = "0.12"
serde_json = "1"

[[bench]]
name = "auth_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
