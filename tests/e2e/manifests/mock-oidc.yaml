apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-oidc-config
  namespace: e2e-auth
data:
  config.json: |
    {
      "interactiveLogin": false,
      "tokenCallbacks": [
        {
          "issuerId": "default",
          "requestMappings": [
            {
              "requestParam": "grant_type",
              "match": ".*",
              "claims": {
                "sub": "testuser",
                "email": "testuser@example.com",
                "email_verified": true,
                "name": "Test User",
                "preferred_username": "testuser"
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
  namespace: e2e-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
        - name: mock-oidc
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_HOST
              value: mock-oidc
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG_PATH
              value: /config/config.json
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: mock-oidc-config
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
  namespace: e2e-auth
spec:
  selector:
    app: mock-oidc
  ports:
    - port: 8080
      targetPort: 8080
