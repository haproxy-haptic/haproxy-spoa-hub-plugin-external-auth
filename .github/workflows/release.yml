name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, and verify without creating the GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

env:
  SIGNING_IDENTITY_PREFIX: https://github.com/haproxy-haptic/haproxy-spoa-hub-plugin-external-auth/.github/workflows/release.yml@
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  sign:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: scripts/sign-release-artifacts.sh
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          : > SHA256SUMS
          for f in *; do
            case "$f" in
              *.sha256 | *.cosign.bundle | SHA256SUMS) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS
          done
          sha256sum --check --strict SHA256SUMS
          for f in *.sha256; do sha256sum --check --strict "$f"; done
      - name: Verify signatures
        working-directory: artifacts
        env:
          IDENTITY_REF: ${{ github.ref }}
        run: |
          identity="${SIGNING_IDENTITY_PREFIX}${IDENTITY_REF}"
          count=0
          while read -r _ f; do
            cosign verify-blob "$f" --bundle "$f.cosign.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$OIDC_ISSUER"
            count=$((count + 1))
          done < SHA256SUMS
          [ "$count" -eq 3 ] || { echo "expected 3 signed artifacts, verified $count" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: sign
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Extract release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
